workflows:
  ios-no-codesign:
    name: iOS Build (No Codesign)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Switch Ruby to 3.x and install pods
        script: |
          export PATH="$HOME/.rbenv/shims:$HOME/.rbenv/bin:$PATH"
          rbenv versions
          RUBY_3=$(rbenv versions --bare | grep -E '^3\.' | sort -V | tail -n 1)
          if [ -n "$RUBY_3" ]; then
            echo "Switching to Ruby $RUBY_3"
            rbenv shell "$RUBY_3"
          fi
          ruby -v
          pod --version
          cd ios && pod install
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app